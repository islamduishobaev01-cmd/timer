
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMaster — 25 Minutes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101322;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #9299ae;
    margin-bottom: 35px;
}

.timer {
    font-size: clamp(75px, 16vw, 130px);
    font-weight: 800;
    letter-spacing: 5px;
    margin: 20px 0;
    font-variant-numeric: tabular-nums;
}

.progress {
    height: 9px;
    background: #292e42;
    border-radius: 20px;
    overflow: hidden;
    margin: 25px 0;
}

.progress-bar {
    height: 100%;
    width: 100%;
    background: #7c6cff;
    transition: width 0.3s;
}

.stage {
    background: #1b2033;
    border: 1px solid #303750;
    border-radius: 16px;
    padding: 25px;
    margin: 25px 0;
}

.stage-name {
    font-size: 25px;
    margin-bottom: 10px;
}

.stage-time {
    color: #a7adbf;
    font-size: 18px;
}

.stages {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 25px 0;
}

.stage-card {
    padding: 20px;
    background: #1b2033;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
}

.stage-card.active {
    border-color: #7c6cff;
    background: #292448;
}

.stage-card h3 {
    font-size: 16px;
    margin-bottom: 8px;
}

.stage-card p {
    color: #a7adbf;
    font-size: 20px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}

button {
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #292e42;
    color: white;
}

button.primary {
    background: #7c6cff;
}

button:hover {
    opacity: .85;
}

@media(max-width: 500px) {
    .stages {
        grid-template-columns: 1fr 1fr;
    }

    .stage-card {
        padding: 15px 8px;
    }
}
</style>
</head>

<body>

<div class="app">

    <h1>TimeMaster</h1>
    <p class="subtitle">25 Minute Session</p>

    <div class="timer" id="timer">25:00</div>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="stage">
        <div class="stage-name" id="stageName">
            Физзарядка
        </div>
        <div class="stage-time" id="stageInfo">
            Этап 1 из 4 · 03:00
        </div>
    </div>

    <div class="stages" id="stages"></div>

    <div class="controls">
        <button class="primary" onclick="startTimer()">
            ▶ Старт
        </button>

        <button onclick="pauseTimer()">
            ⏸ Пауза
        </button>

        <button onclick="resetTimer()">
            ↻ Сброс
        </button>

        <button onclick="toggleFullscreen()">
            ⛶ Экран
        </button>
    </div>

</div>

<script>
const initialStages = [
    { name: "Физзарядка", seconds: 180 },
    { name: "Мозговой штурм", seconds: 480 },
    { name: "Проблема / идея", seconds: 600 },
    { name: "Игра", seconds: 240 }
];

let stages = initialStages.map(s => ({...s}));
let currentStage = 0;
let remaining = stages[0].seconds;
let running = false;
let interval = null;

const totalTime = () =>
    stages.reduce((sum, s) => sum + s.seconds, 0);

function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;

    return String(min).padStart(2, "0") + ":" +
           String(sec).padStart(2, "0");
}

function render() {
    const elapsed = stages
        .slice(0, currentStage)
        .reduce((sum, s) => sum + s.seconds, 0)
        + (stages[currentStage].seconds - remaining);

    document.getElementById("timer").textContent =
        formatTime(remaining);

    document.getElementById("stageName").textContent =
        stages[currentStage].name;

    document.getElementById("stageInfo").textContent =
        `Этап ${currentStage + 1} из 4 · ${formatTime(stages[currentStage].seconds)}`;

    document.getElementById("progress").style.width =
        (100 - elapsed / totalTime() * 100) + "%";

    document.getElementById("stages").innerHTML =
        stages.map((stage, index) => `
            <div class="stage-card ${index === currentStage ? "active" : ""}">
                <h3>${stage.name}</h3>
                <p>${formatTime(stage.seconds)}</p>
            </div>
        `).join("");
}

function playSound() {
    try {
        const audio = new AudioContext();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.frequency.value = 800;
        gain.gain.value = 0.15;

        oscillator.start();
        oscillator.stop(audio.currentTime + 0.5);
    } catch (e) {}
}

function startTimer() {
    if (running) return;

    running = true;

    interval = setInterval(() => {
        if (remaining > 0) {
            remaining--;
            render();
        }

        if (remaining === 0) {
            playSound();

            if (currentStage < stages.length - 1) {
                currentStage++;
                remaining = stages[currentStage].seconds;
                render();
            } else {
                pauseTimer();
                document.getElementById("stageName").textContent =
                    "Пятиминутка завершена!";
                document.getElementById("timer").textContent = "00:00";
                document.getElementById("progress").style.width = "0%";
                playSound();
            }
        }
    }, 1000);
}

function pauseTimer() {
    running = false;
    clearInterval(interval);
}

function resetTimer() {
    pauseTimer();
    currentStage = 0;
    remaining = stages[0].seconds;
    render();
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
    } else {
        document.exitFullscreen?.();
    }
}

render();
</script>

</body>
</html>
